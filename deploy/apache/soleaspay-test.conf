<VirtualHost *:80>
    ServerName soleaspay.test
    ServerAlias www.soleaspay.test

    DocumentRoot "/Users/Zhuanz/work/landing-soleaspay/dist"
    DirectoryIndex index.html

    # The project is exported with Next.js basePath "/home".
    # This alias strips the public /home prefix and serves the generated files
    # from dist/, so /home/about resolves to dist/about.html.
    Alias "/home" "/Users/Zhuanz/work/landing-soleaspay/dist"

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule "^/home/?$" "/index.html" [L]
        RewriteCond "/Users/Zhuanz/work/landing-soleaspay/dist/$1.html" -f
        RewriteRule "^/home/(.+?)/?$" "/$1.html" [L]
    </IfModule>

    <Directory "/Users/Zhuanz/work/landing-soleaspay/dist">
        Options FollowSymLinks MultiViews
        MultiviewsMatch Any
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch 302 ^/$ /home/

    ErrorDocument 404 /home/404.html

    <FilesMatch "\.(html|txt)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    ErrorLog "/private/var/log/apache2/soleaspay-test-error.log"
    CustomLog "/private/var/log/apache2/soleaspay-test-access.log" common
</VirtualHost>
