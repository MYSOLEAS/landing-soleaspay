ServerRoot "/usr"
ServerName soleaspay.test:8088
Listen 127.0.0.1:8088
PidFile "/tmp/soleaspay-test-httpd.pid"
Mutex default:/tmp

LoadModule mpm_prefork_module libexec/apache2/mod_mpm_prefork.so
LoadModule authz_core_module libexec/apache2/mod_authz_core.so
LoadModule authz_host_module libexec/apache2/mod_authz_host.so
LoadModule alias_module libexec/apache2/mod_alias.so
LoadModule dir_module libexec/apache2/mod_dir.so
LoadModule headers_module libexec/apache2/mod_headers.so
LoadModule log_config_module libexec/apache2/mod_log_config.so
LoadModule mime_module libexec/apache2/mod_mime.so
LoadModule negotiation_module libexec/apache2/mod_negotiation.so
LoadModule rewrite_module libexec/apache2/mod_rewrite.so
LoadModule unixd_module libexec/apache2/mod_unixd.so

TypesConfig "/private/etc/apache2/mime.types"
DirectoryIndex index.html

ErrorLog "/tmp/soleaspay-test-error.log"
CustomLog "/tmp/soleaspay-test-access.log" common

<VirtualHost 127.0.0.1:8088>
    ServerName soleaspay.test
    ServerAlias www.soleaspay.test

    DocumentRoot "/Users/Zhuanz/work/landing-soleaspay/dist"

    # The Next.js export uses basePath "/home".
    # This alias maps /home/about to dist/about.html and /home/_next to dist/_next.
    Alias "/home" "/Users/Zhuanz/work/landing-soleaspay/dist"

    RewriteEngine On
    RewriteRule "^/home/?$" "/index.html" [L]
    RewriteCond "/Users/Zhuanz/work/landing-soleaspay/dist/$1.html" -f
    RewriteRule "^/home/(.+?)/?$" "/$1.html" [L]

    <Directory "/Users/Zhuanz/work/landing-soleaspay/dist">
        Options FollowSymLinks MultiViews
        MultiviewsMatch Any
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch 302 ^/$ /home/
    ErrorDocument 404 /home/404.html

    <FilesMatch "\.(html|txt)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</VirtualHost>
